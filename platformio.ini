; PlatformIO project — Orcon 15RF controller for the Heltec WiFi LoRa 32 V2 (ESP32 + SX1276) only.
;
; Every environment builds that one board with the pinned classic ESP32/Arduino toolchain:
;   heltec_v2_sx1276          RX-only image (the A/B rollback image; no RF transmission)
;   heltec_v2_sx1276_control  daily-use control image (RF budget, web login, Siri)
;   the other heltec_v2_sx1276_* environments are dry-run and RF test builds (below).
; Images are written only with tools/heltec_v2.sh (USB) or tools/orcon.py ota-install (signed
; OTA), never with a PlatformIO upload.

[platformio]
default_envs = heltec_v2_sx1276

[env]
; Pin classic ESP32/Arduino toolchain for reproducible Heltec V2 builds.
platform = espressif32@6.7.0
board = heltec_wifi_lora_32_V2
framework   = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DRADIO_SX1276=1
    -DBOARD_HELTEC_V2=1
; Exact versions for every env (as resolved by CI run 42388059033), so builds and
; RX measurements are reproducible. Bump deliberately, one at a time.
lib_deps =
    jgromes/RadioLib @ 7.8.1
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.4.3
    olikraus/U8g2 @ 2.36.18

; ---- RECEIVE-ONLY image ---------------------------------------------------------
; The SX1276 keeps the continuous/direct FSK mode, so RX reads the demodulated
; data off DIO2 with a UART. RX_ONLY (config.h): no TX path, no pairing/commands.
[env:heltec_v2_sx1276]
build_flags =
    ${env.build_flags}

; ---- Phase 1: explicit opt-in, software dry-run, legacy command locks ON ------
[env:heltec_v2_sx1276_tx_poc_dryrun]
extends = env:heltec_v2_sx1276
build_flags =
    ${env:heltec_v2_sx1276.build_flags}
    -DRX_ONLY=1
    -DORCON_TX_POC=1
    -DORCON_TX_RF_ENABLE=0

; RF backend compile target. The old dry-run HTTP portal refuses RF commands.
; Use heltec_v2_sx1276_webctl for the explicit RF web-control test configuration.
; Test configuration: 868.3 MHz, requested 10 dBm. RF measurements still required.
; Flash ONLY with separate hardware consent and an RF test plan (docs).
[env:heltec_v2_sx1276_tx_poc]
extends = env:heltec_v2_sx1276_tx_poc_dryrun
build_flags =
    ${env:heltec_v2_sx1276.build_flags}
    -DRX_ONLY=1
    -DORCON_TX_POC=1
    -DORCON_TX_RF_ENABLE=1

; ---- Phase 2: webbediening via de setup-wizard UI op de txpoc-bedieningslaag --
; heltec_v2_sx1276_webctl_dryrun is de veilige standaard: volledige keten
; web -> API -> txpoc-transactie -> 31D9-correlatie, maar zonder RF-uitzending
; (DryRunBackend). heltec_v2_sx1276_webctl is de expliciete RF-testconfiguratie.
[env:heltec_v2_sx1276_webctl_dryrun]
extends = env:heltec_v2_sx1276_tx_poc_dryrun
build_flags =
    ${env:heltec_v2_sx1276.build_flags}
    -DRX_ONLY=1
    -DORCON_TX_POC=1
    -DORCON_TX_RF_ENABLE=0
    -DORCON_WEB_CONTROL=1

[env:heltec_v2_sx1276_webctl]
extends = env:heltec_v2_sx1276_tx_poc_dryrun
build_flags =
    ${env:heltec_v2_sx1276.build_flags}
    -DRX_ONLY=1
    -DORCON_TX_POC=1
    -DORCON_TX_RF_ENABLE=1
    -DORCON_WEB_CONTROL=1
; RF test image: the web-control RF build, capped at 50 started packets per boot
; (counted in the RF backend before the radio is touched; 2 s floor between packets).
; Only tools/heltec_v2.sh with ORCON_RF_TEST_ACK may write it; diagnostic, never a release.
[env:heltec_v2_sx1276_rftest]
extends = env:heltec_v2_sx1276_webctl
build_flags =
    ${env:heltec_v2_sx1276_webctl.build_flags}
    -DORCON_TX_MAX_PER_BOOT=50
    -DORCON_TX_PAIR=1
; Daily-use control image: the RF web-control build with pairing, bounded by the rolling RF
; budget (10 packets per minute, 60 per hour, measured airtime per hour; kept across software
; restarts in RTC memory) instead of the per-boot test cap, behind the web login. Written only
; with its acknowledgement phrase (tools/heltec_v2.sh ORCON_CONTROL_ACK, orcon.py --tx-ack);
; signed OTA variant "control".
[env:heltec_v2_sx1276_control]
extends = env:heltec_v2_sx1276_webctl
build_flags =
    ${env:heltec_v2_sx1276_webctl.build_flags}
    -DORCON_TX_PAIR=1
    -DORCON_TX_CONTROL=1
; ---- Native unit tests (host) -----------------------------------------------
; Run with:  pio test -e native   (or build test/*.cpp directly with g++)
[env:native]
platform = native
build_flags = -std=c++17 -I src
test_framework = custom
