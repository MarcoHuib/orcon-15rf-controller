name: Matter (ESP-IDF 5) checks

# Unprivileged checks of the experimental Matter build (docs/MATTER.md): the host tests (all suites, including
# test/matter/), the safety guards, the privacy check, and the ESP-IDF/Matter build with the PLACEHOLDER identity.
# No secrets, no keys, nothing published: a placeholder image never starts Matter, and no artifact is uploaded.
# Reviewed and pinned by content in tools/test_tx_poc_safety.py (WORKFLOWS), like every workflow of this repository.
on:
  pull_request:
    paths:
      - 'idf/**'
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      - 'docs/MATTER.md'
      - '.github/workflows/matter.yml'
  workflow_dispatch:

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  host:
    name: Host tests and privacy check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: PlatformIO, hash-pinned, in its own environment
        run: |
          python -m venv "$RUNNER_TEMP/pio-venv"
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: --force-reinstall -r tools/release/requirements-platformio.txt
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip check
          echo "$RUNNER_TEMP/pio-venv/bin" >> "$GITHUB_PATH"
      - name: The pinned libraries
        run: pio pkg install -e heltec_v2_sx1276 -e heltec_v2_sx1276_control
      - name: Host tests (all suites, including the Matter rules and pages)
        run: bash test/run_host_tests.sh
      - name: Safety guards (TX paths and their admission, update TLS roots, workflow pins, capability compiles)
        run: python3 -B tools/test_tx_poc_safety.py
      - name: Privacy check of every tracked file
        run: python3 -I tools/check_privacy.py

  idf:
    name: ESP-IDF 5 Matter build (placeholder identity)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: PlatformIO, hash-pinned, in its own environment
        run: |
          python -m venv "$RUNNER_TEMP/pio-venv"
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: --force-reinstall -r tools/release/requirements-platformio.txt
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip check
          echo "$RUNNER_TEMP/pio-venv/bin" >> "$GITHUB_PATH"
      - name: The pinned libraries and arduino-esp32
        run: bash tools/fetch_idf_deps.sh
      - name: Build Orcon + Matter in the pinned ESP-Matter container (no identity)
        run: bash tools/build_idf.sh
