name: Heltec V2 RX-only firmware

on:
  push:
    branches:
      - feature/heltec-v2-rx-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Heltec V2 (RX-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify listen-only safety guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("src/main.cpp").read_text()
          radio = Path("src/ramses_radio.cpp").read_text()
          config = Path("platformio.ini").read_text()

          sx = radio.split("#if defined(RADIO_SX1276)", 1)
          assert len(sx) == 2, "SX1276 backend not found"
          tx = sx[1].split("bool sendFrame(const ramses::Frame& f) {", 1)
          assert len(tx) == 2, "SX1276 sendFrame not found"
          tx_body = tx[1].split("bool poll(ramses::Frame& out)", 1)[0]

          assert "g_radio.transmit(" not in tx_body, "SX1276 TX path is active"
          assert "return false;" in tx_body, "SX1276 sendFrame is not blocked"
          sx_body = sx[1].split("#endif // RADIO_SX1276", 1)[0]
          for bad in ("g_radio.transmit", "startTransmit", "transmitDirect", "RADIOLIB_SX127X_TX"):
              assert bad not in sx_body, f"SX1276 backend references {bad}"
          # RadioLib FSK getRSSI() with default args = startReceive()+standby(): kills direct RX
          assert "getRSSI()" not in sx_body, "SX1276 backend calls getRSSI() without skipReceive"
          assert not any(line.strip().startswith("orcon::tick(")
                         for line in main.splitlines()), "Periodic TX remains active"
          assert "[env:heltec_v2_sx1276]\n" in config
          assert "platform = espressif32@6.7.0" in config
          print("PASS: SX1276 transmission path is blocked")
          PY

      - name: Run RAMSES protocol unit tests
        shell: bash
        run: |
          g++ -std=c++17 -I src test/test_codec.cpp src/ramses_codec.cpp -o /tmp/orcon-test-codec
          /tmp/orcon-test-codec
          g++ -std=c++17 -I src test/test_frames.cpp src/ramses_codec.cpp src/orcon_frames.cpp -o /tmp/orcon-test-frames
          /tmp/orcon-test-frames
          g++ -std=c++17 -I src test/test_rx.cpp src/ramses_codec.cpp -o /tmp/orcon-test-rx
          /tmp/orcon-test-rx
          g++ -std=c++17 -I src -I test/shim test/test_log.cpp src/ramses_codec.cpp src/orcon_frames.cpp src/orcon_log.cpp -o /tmp/orcon-test-log
          /tmp/orcon-test-log

      - name: Install pinned PlatformIO
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check "platformio==6.1.18"
          .venv/bin/pio --version

      - name: Build for Heltec WiFi LoRa 32 V2
        shell: bash
        env:
          PLATFORMIO_BUILD_FLAGS: '-DFW_VERSION=\"${{ github.sha }}\"'
        run: .venv/bin/pio run -e heltec_v2_sx1276

      - name: Package flash images
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/heltec_v2_sx1276/firmware.bin dist/firmware.bin
          cp .pio/build/heltec_v2_sx1276/partitions.bin dist/partitions.bin
          cp .pio/build/heltec_v2_sx1276/bootloader.bin dist/bootloader.bin
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" dist/boot_app0.bin

          # The image must carry this commit and the RX-only guard string.
          grep -q -a "$GITHUB_SHA" dist/firmware.bin
          grep -q -a "TX blocked: RX-only firmware" dist/firmware.bin
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "env=heltec_v2_sx1276"
            echo "chip=esp32"
            .venv/bin/pio pkg list -e heltec_v2_sx1276 2>/dev/null | grep -E 'RadioLib|framework-arduinoespressif32|espressif32' || true
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt

          .venv/bin/python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" \
            --chip esp32 merge_bin -o dist/heltec-v2-rx-only-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 8MB \
            0x1000 dist/bootloader.bin \
            0x8000 dist/partitions.bin \
            0xe000 dist/boot_app0.bin \
            0x10000 dist/firmware.bin

          cat > dist/FLASHING.txt <<'HELP'
          Heltec WiFi LoRa 32 V2 (classic ESP32 / SX1276) - RX-only firmware.
          Use the official browser flasher https://espressif.github.io/esptool-js/
          Flash heltec-v2-rx-only-merged.bin at address 0x0.
          DO NOT use 0x10000 for the merged image.
          This build deliberately disables 868 MHz transmissions.
          HELP
          (cd dist && shasum -a 256 *.bin > SHA256SUMS.txt)

      - name: Upload firmware artifacts (not flashed automatically)
        uses: actions/upload-artifact@v4
        with:
          name: heltec-v2-rx-only
          path: dist/
          if-no-files-found: error
          retention-days: 14
