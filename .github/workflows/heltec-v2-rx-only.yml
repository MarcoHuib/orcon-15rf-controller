name: Heltec V2 RX-only firmware (disabled - checks run locally)

# DISABLED. This project runs no GitHub Actions at the moment: builds, tests, privacy and safety checks run
# locally. This file used to build and package the RX-only image and to run checks on web pages that no
# longer exist. Its checks now live in the local tests:
#   - listen-only safety guards, check_tick (both ways), route/capability guards: tools/test_tx_poc_safety.py
#   - privacy check and its negative cases: tools/check_privacy.py, tools/test_check_privacy.py
#   - host test suites (plain; ASan+UBSan / TSan via CXXFLAGS): test/run_host_tests.sh
#   - flash tooling, rxmon, firmware builds, image markers, partition table: pwsh tools/test_local.ps1 -Firmware
#   - packaging for USB/OTA (markers, forbidden OTA strings, local evidence): tools/heltec_v2.sh package
# It has no push, pull_request, tag or schedule trigger. A manual run stops at once with this notice and
# builds, tests, signs, uploads and deploys nothing, so it can never pass for a real check.
# tools/test_tx_poc_safety.py pins every workflow file by content (WORKFLOWS): that local test fails when this
# stub changes or a workflow is added without a reviewed update there (run it before every push; GitHub does
# not consult it). A manual run uses the file of the branch or tag chosen: a ref from before this stub (main
# before the merge of PR #15) still has the old workflow. A future release workflow is a separate
# file with its own security checks: only its release-signing job may read the OTA signing key, as a secret of
# a protected GitHub Environment. The key is never in the repository or available to push, PR or test workflows.
on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    name: Disabled (run the local checks instead)
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Stop
        run: |
          echo "::error::This workflow is disabled and checks nothing. Run the local checks: pwsh tools/test_local.ps1 -Firmware (see the header of this file)."
          exit 1
